name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Aynı dal için üst üste gelen çalıştırmalarda öncekini iptal et
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # HER İŞTE `timeout-minutes` VAR — bu bir tercih değil, ölçülmüş bir kapı
  #
  # GitHub'ın varsayılanı iş başına 360 DAKİKA. Yani asılan bir adım altı saat
  # koşucu tüketiyor ve o süre boyunca "çalışıyor" görünüyor: kırmızı bir X
  # gelmediği için kimse bakmıyor. `f61a470` push'unda AppImage işi tam olarak
  # böyle davrandı — apt adımında yarım saat asılı kaldı ve elle iptal edildi.
  #
  # Sınırlar tipik sürenin 4-8 katı; yani yavaş bir koşucu yanlış alarm
  # üretmiyor ama asılan bir adım dakikalar içinde KIRMIZI oluyor. Sessiz bir
  # bekleme, açık bir başarısızlıktan her zaman kötüdür.
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      # Bir ayak kırılınca diğerini de iptal etme — platforma özel
      # hataları tek koşuda görmek istiyoruz
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]   # README: Python 3.11 veya üzeri

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        # Hedef dizinler ve gevşek ayarlar pyproject.toml [tool.mypy] içinde
        run: mypy

      # Statik güvenlik analizi — hızlı yarısı. bandit saf Python ve ~1.5 sn,
      # o yüzden matrisin iki ayağında da çalışıyor. Ağır yarısı (semgrep)
      # aşağıdaki ayrı `security` işinde ve yalnızca Linux'ta.
      #
      # `-c pyproject.toml` ZORUNLU: bandit yapılandırmayı kendiliğinden
      # bulmuyor. Susturulan denetimler ve gerekçeleri orada, [tool.bandit]
      # bloğunun yorumlarında.
      - name: Güvenlik linteri (bandit)
        run: bandit -c pyproject.toml -q -r CORE DB UI main.py

      - name: Test (pytest)
        run: pytest --junitxml=test-results.xml

      # Aşağıdaki iki adım `always()` taşıyor: asıl değerleri testler
      # KIRILDIĞINDA ortaya çıkıyor. `pytest` adımı kırmızıysa iş yine
      # başarısız sayılıyor — bunlar sonucu değiştirmiyor, görünür kılıyor.
      - name: Test özeti
        if: always()
        run: >
          python .github/scripts/test_summary.py
          test-results.xml
          "${{ matrix.os }} · Python ${{ matrix.python-version }}"
          >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      # Başarısız test ADLARINI annotation olarak yayınla.
      #
      # Özet tablosu ve iş günlükleri yalnızca oturum açmış bir tarayıcıdan
      # okunabiliyor; annotation'lar check-run API'sinden YETKİSİZ okunuyor.
      # 3.5 turunda Windows ayağı kırıldı ve hangi testin düştüğü hiçbir
      # yerden öğrenilemedi — bu adım o boşluğu kapatıyor.
      #
      # Çıktı BİLEREK $GITHUB_STEP_SUMMARY'ye yönlendirilmiyor: workflow
      # komutları günlük akışında olmalı, özet dosyasında değil.
      - name: Başarısız testleri işaretle
        if: failure()
        run: >
          python .github/scripts/test_summary.py
          test-results.xml
          "${{ matrix.os }} · Python ${{ matrix.python-version }}"
          --annotations
        shell: bash

      # Sayıların günlüğe inmeden görünmesi için. Depo günlüklerini API'den
      # indirmek yönetici yetkisi istiyor (403); artifact istemiyor.
      - name: Test raporunu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: warn

  # ────────────────────────────────────────────────────────────────────────────
  # semgrep — ayrı iş, yalnızca Linux
  #
  # Neden matrisin içinde değil:
  #   · Tekerleği ~57 MB; Windows ayağında da indirmek her koşuya bir dakika
  #     ekler ve karşılığında YENİ bir bilgi vermez — statik analiz sonucu
  #     platformdan bağımsız.
  #   · Kayıt defteri paketleri semgrep.dev'den iniyor, yani bu iş ağa
  #     bağımlı. Ayrı bir iş olarak durunca bir kesinti testleri değil
  #     yalnızca bu işi kırıyor ve hangisinin düştüğü checks listesinde
  #     tek bakışta görünüyor.
  # ────────────────────────────────────────────────────────────────────────────
  security:
    name: Statik güvenlik analizi (semgrep + pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # PYTHONUTF8=1: semgrep kural dosyasını yerel kod sayfasıyla okuyor ve
    # Türkçe karakterli bir kural dosyası UTF-8 olmayan bir locale altında
    # UnicodeDecodeError ile çöküyor. Linux koşucusu zaten UTF-8 ama değişken
    # burada da veriliyor ki iş akışı, belgelenen elle çalıştırma komutuyla
    # birebir aynı olsun (BACKLOG.md / B-020).
    env:
      PYTHONUTF8: "1"
      SEMGREP_SEND_METRICS: "off"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-security.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-security.txt

      # 1) Yerel kurallar — AĞ GEREKTİRMEZ. HYCLEUS'un SECURITY.md'de yazılı
      #    verdiği sözleri denetliyor (zayıf rastgelelik, ECB, sabit nonce,
      #    sabit KDF tuzu, gömülü anahtar). Sert kapı.
      - name: Semgrep — yerel kurallar
        run: >
          semgrep scan
          --config=.semgrep/hycleus.yml
          --metrics=off --error --quiet
          CORE DB UI main.py .github

      # 2) Kayıt defteri paketleri — genel Python güvenliği. Ağ gerektirir.
      #    Bu da sert kapı: sessiz bir kapı, kırılgan bir kapıdan kötüdür.
      #    semgrep.dev kesintisi olursa iş kırılır ve yeniden çalıştırılır —
      #    bulgu kaçırmaktansa gürültü tercih edildi.
      - name: Semgrep — kayıt defteri paketleri
        run: >
          semgrep scan
          --config=p/python --config=p/secrets --config=p/security-audit
          --metrics=off --error --quiet
          CORE DB UI main.py .github

      # 3) Kuralların ÖLÜ OLMADIĞINI kanıtlayan kanarya testleri. Yukarıdaki
      #    iki adım yeşil geçtiğinde bu adım olmadan "kod temiz" ile "kural
      #    hiçbir şey aramıyor" ayırt edilemez.
      - name: Kural kanaryaları (pytest)
        run: pytest tests/test_static_analysis.py -v

      # ──────────────────────────────────────────────────────────────────────
      # 4) BAĞIMLILIK zafiyet taraması — semgrep KODA bakıyor, bu KÜTÜPHANEYE
      #
      # İki adım farklı soruları yanıtlıyor ve biri diğerinin yerine geçmiyor:
      # semgrep "bizim yazdığımız kodda zafiyet deseni var mı" diyor,
      # pip-audit "kullandığımız sürümlerde bilinen bir CVE var mı" diyor.
      # HYCLEUS'un saldırı yüzeyinin büyük kısmı bağımlılıklarda
      # (cryptography, PySide6, requests) ve o yüzey şimdiye kadar hiç
      # taranmıyordu.
      #
      # ⚠️ GEVŞEK KAPI — BİLEREK, ama gerekçesi ALIŞILDIK OLANDAN FARKLI.
      #
      # Normalde gevşek başlangıcın sebebi "mevcut bulgular CI'ı kırmasın"
      # olur. Burada öyle değil: ilk tarama TEMİZ çıktı (49 paket, PyPI ve
      # OSV kaynaklarının ikisinde de 0 bulgu, 2026-08-20). Yani sert kapı
      # bugün hiçbir şeyi kırmazdı.
      #
      # Gevşek bırakılmasının sebebi başka: bu adım, DEPODAKİ HİÇBİR ŞEY
      # DEĞİŞMEDEN kırılabilen tek adım. Yukarıda bir CVE yayınlandığı an
      # tamamen ilgisiz bir PR kırmızıya döner. Semgrep kayıt defteri
      # adımında bu gürültü bilerek kabul edildi ("bulgu kaçırmaktansa
      # gürültü") — orada tetikleyici bizim kodumuz; burada tetikleyici
      # bizim dışımızda ve düzeltme çoğu zaman bir sürüm yükseltmesi,
      # yani ayrı bir iş.
      #
      # Bu yüzden bulgu KIRMIZI YAPMIYOR ama GÖRÜNMEZ de değil: iş özetine
      # yazılıyor ve artifact olarak yükleniyor. Sessiz bir gevşek kapı,
      # olmayan bir kapıdır.
      #
      # Sertleştirme kriteri BACKLOG.md / B-039'da yazılı.
      #
      # PYTHONUTF8=1 (iş düzeyinde zaten verili) BURADA DA ZORUNLU:
      # pip-audit'in requirements ayrıştırıcısı dosyaları YEREL KOD
      # SAYFASIYLA açıyor ve requirements dosyalarımız Türkçe yorum
      # taşıyor. Türkçe bir Windows'ta (cp1254) ölçüldü: değişken olmadan
      # UnicodeDecodeError ile ÇÖKÜYOR. B-020'nin birebir tekrarı.
      - name: Bağımlılık zafiyet taraması (pip-audit)
        id: pip_audit
        continue-on-error: true
        # Tek çözümleme ~12 sn ölçüldü (49 paket); iki tarama + ağ payı.
        timeout-minutes: 8
        run: |
          set -uo pipefail
          # Çıkış kodu ELDE TUTULUYOR. `continue-on-error` işi yeşil
          # tutuyor ama `steps.pip_audit.outcome` gerçek sonucu taşıyor ve
          # özet adımı onu okuyor. `|| durum=$?` şart: GitHub `run:`
          # bloklarını `bash -e` ile koşuyor, yani ilk hatada betik
          # doğrudan biter ve kod hiç yakalanamaz.
          durum=0
          # 1) KISA tablo — iş özetine gidiyor. `--desc on` BİLEREK YOK:
          #    ölçüldü, 23 bulguda açıklamalı çıktı 26 KB / açıklamasız
          #    3 KB. Özet eyleme dönüştürülebilir olanı göstermeli
          #    (paket, sürüm, düzeltme sürümü); kimlikler zaten osv.dev'e
          #    bağlantılı.
          pip-audit -r requirements.txt -r requirements-dev.txt             --progress-spinner off             --format markdown > pip-audit.md || durum=$?
          # 2) TAM kayıt — yalnızca artifact. Açıklamalar burada; boyut
          #    önemli değil. Bu satırın başarısızlığı sonucu
          #    DEĞİŞTİRMEMELİ, karar 1. taramanın.
          pip-audit -r requirements.txt -r requirements-dev.txt             --desc on --progress-spinner off             --format json > pip-audit.json || true
          # Temiz taramada markdown çıktısı BOŞ kalıyor ve "No known
          # vulnerabilities found" stderr'e gidiyor (ölçüldü).
          if [ -s pip-audit.md ]; then cat pip-audit.md; else echo "Bulgu yok."; fi
          exit $durum

      - name: Zafiyet özeti
        if: always()
        run: |
          {
            echo "## Bağımlılık zafiyet taraması (pip-audit)"
            echo
            if [ "${{ steps.pip_audit.outcome }}" = "success" ]; then
              echo "✅ Bilinen zafiyet bulunamadı."
            else
              echo "⚠️ **Zafiyet bulundu.** Bu adım CI'ı KIRMIYOR (gevşek kapı,"
              echo "bkz. ci.yml yorumu ve BACKLOG.md / B-039) ama bulgular"
              echo "değerlendirilmeli."
            fi
            echo
            if [ -s pip-audit.md ]; then cat pip-audit.md; fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Günlüğe güvenmeden indirilip incelenebilsin — AppImage/EXE
      # artifact'larıyla aynı gerekçe.
      - name: Zafiyet raporunu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-raporu
          path: |
            pip-audit.md
            pip-audit.json
          if-no-files-found: warn

  # ────────────────────────────────────────────────────────────────────────────
  # AppImage — Linux dağıtım yapısı
  #
  # Neden ayrı iş ve neden CI'da:
  #   · PyInstaller ÇAPRAZ DERLEME YAPMAZ. Linux ikilisi Linux'ta üretilmek
  #     zorunda; depo Windows'ta geliştiriliyor, yani bu yapının tek
  #     çalıştırılabildiği yer burası.
  #   · `test` matrisinin içine konsaydı Windows ayağında da koşacak ve
  #     orada anlamsız olacaktı.
  #   · Paketleme CI'ın en GEÇ haber veren parçası: bir spec hatası bütün
  #     testler yeşilken ancak dağıtılan yapıyı biri açtığında görünür.
  #     Her push'ta üretmek o gecikmeyi sıfıra indiriyor.
  #
  # Duman testi GUI AÇMIYOR: main() USB bulamayınca modal bir kutu açar ve
  # başsız koşucuda asılı kalırdı. Bunun yerine --version/--selftest
  # kullanılıyor (bkz. main.py, packaging/linux/smoke-test.sh).
  # ────────────────────────────────────────────────────────────────────────────
  appimage:
    name: AppImage yapısı (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      # PySide6 tekerleği kendi Qt kütüphanelerini taşıyor ama onların
      # bağlandığı SİSTEM kütüphaneleri koşucuda yok. Hem PyInstaller'ın
      # analizi hem de --selftest PySide6'yı içe aktarıyor; bunlar olmadan
      # ikisi de "libEGL.so.1: cannot open shared object file" ile düşer.
      #
      # FUSE KURULMUYOR: appimagetool `--appimage-extract-and-run` ile,
      # duman testi de `--appimage-extract` ile çalışıyor. Ubuntu 24.04'te
      # libfuse2 yok ve onu kurmak, testin gerçek kullanıcı ortamına
      # benzerliğini artırmadan bir bağımlılık daha eklerdi.
      #
      # BU ADIM ASILDI (f61a470, ~30 dk) — üç ayrı mekanizma kapatıldı.
      #
      # apt'nin CI'da asılmasının bilinen üç yolu var ve hangisinin
      # yakaladığı günlükten ayırt edilemedi, o yüzden üçü de kapatılıyor:
      #
      #   1. dpkg KİLİDİ. Koşucu görüntüsünde `apt-daily` ve
      #      `unattended-upgrades` systemd zamanlayıcıları var; açılıştan
      #      hemen sonra tetiklenirlerse `/var/lib/dpkg/lock-frontend`
      #      tutulur. `DPkg::Lock::Timeout=180` beklemeyi SINIRLIYOR:
      #      kilit üç dakikada açılmazsa adım net bir hatayla düşüyor.
      #
      #   2. needrestart. Ubuntu 22.04+ koşucu görüntülerinde kurulu ve
      #      kurulum sırasında "hangi servisler yeniden başlatılsın"
      #      diyaloğunu açabiliyor. TTY yokken bile bloklayabildiği için
      #      `NEEDRESTART_MODE=a` ile otomatiğe alınıyor;
      #      `DEBIAN_FRONTEND=noninteractive` de debconf tarafını susturuyor.
      #      `-y` bunların HİÇBİRİNİ kapatmıyor — sık yapılan varsayım bu.
      #
      #   3. Ayna yanıt vermiyor. `Acquire::Retries=3` ile yeniden deneniyor,
      #      `Acquire::http::Timeout=30` ile her denemenin süresi sınırlı
      #      (apt'nin varsayılanı 120 sn ve üç indirmede dakikalara çıkıyor).
      #
      # `timeout-minutes: 6` son emniyet: yukarıdakilerin kaçırdığı bir
      # asılma da altı dakikada KIRMIZI oluyor. Adım normalde ~20 saniye.
      - name: Sistem kütüphaneleri (Qt)
        timeout-minutes: 6
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
          NEEDRESTART_SUSPEND: "1"
        run: |
          set -euo pipefail
          APT_OPTS=(
            -o DPkg::Lock::Timeout=180
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )
          sudo apt-get "${APT_OPTS[@]}" update -qq
          sudo apt-get "${APT_OPTS[@]}" install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xkb1 libxcb-randr0 libxcb-render-util0

      - name: Install dependencies
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      # Sistem kütüphanelerinin GERÇEKTEN yettiğini burada ölçüyoruz,
      # PyInstaller'ın uzun analizinin ortasında değil.
      #
      # Eksik bir kütüphanenin belirtisi "libEGL.so.1: cannot open shared
      # object file" ve o hata yapı adımının derinlerinde, yüzlerce satırlık
      # bir günlüğün içinde çıkıyor. Bir satırlık bu içe aktarma aynı hatayı
      # adım ADINDA gösteriyor: "Qt içe aktarılabiliyor mu" kırmızıysa sorun
      # paketlemede değil, yukarıdaki apt listesinde.
      - name: Qt içe aktarılabiliyor mu
        timeout-minutes: 3
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "import PySide6.QtWidgets; print('Qt yuklendi')"

      - name: AppImage üret
        timeout-minutes: 12
        run: bash packaging/linux/build-appimage.sh

      - name: Duman testi
        run: bash packaging/linux/smoke-test.sh dist/HYCLEUS-*.AppImage

      # Yapıyı indirilebilir bırakmak, "AppImage üretildi" iddiasını
      # denetlenebilir kılıyor: kimse CI günlüğüne güvenmek zorunda değil.
      - name: AppImage'ı yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HYCLEUS-AppImage
          path: dist/*.AppImage
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────────
  # Windows EXE — dağıtım yapısı
  #
  # `appimage` işinin birebir karşılığı; gerekçeler de aynı: paketleme CI'ın
  # en GEÇ haber veren parçası, ve `test` matrisine girseydi Ubuntu ayağında
  # da koşup orada anlamsız olurdu.
  #
  # Bu iş B-024'ün kapısı. O bulgunun iki yarısı da bu kurulumun yokluğunda
  # oluşmuştu ve ikisi de SESSİZDİ:
  #   · spec `data/` istiyordu, dizin .gitignore'daydı — yapı yalnızca o
  #     dizini zaten üretmiş makinelerde çalışıyordu, yani herkesinkinde.
  #   · paket on modülü eksik taşıyordu, uygulama yine de açılıyordu.
  # Ölçüm yöntemi ikisi için de aynı: temiz bir checkout'ta derle,
  # --selftest çalıştır (bkz. packaging/windows/smoke-test.ps1).
  #
  # `data/` BİLEREK oluşturulmuyor. -TemizAgac anahtarı dizin varsa yapıyı
  # durduruyor: bu iş, "taze klonda derlenir mi" sorusunu ölçmek için var.
  # ────────────────────────────────────────────────────────────────────────────
  exe:
    name: EXE yapısı (Windows)
    runs-on: windows-latest
    # Windows koşucusu Linux'unkinden belirgin yavaş (dosya sistemi ve
    # Defender taraması); sınır bu yüzden AppImage işinden yüksek.
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      # requirements.txt `wmi; sys_platform == "win32"` işaretçisi taşıyor,
      # yani wmi + pywin32 yalnızca burada kuruluyor. Duman testi ikisinin
      # de PAKETE girdiğini ayrıca doğruluyor.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: EXE üret (temiz ağaç)
        run: .\packaging\windows\build-exe.ps1 -TemizAgac

      - name: Duman testi
        run: .\packaging\windows\smoke-test.ps1

      # AppImage işindeki gerekçe: yapıyı indirilebilir bırakmak "EXE
      # üretildi" iddiasını denetlenebilir kılıyor.
      - name: EXE'yi yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HYCLEUS-EXE
          path: dist/HYCLEUS.exe
          if-no-files-found: error
