name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Aynı dal için üst üste gelen çalıştırmalarda öncekini iptal et
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Bir ayak kırılınca diğerini de iptal etme — platforma özel
      # hataları tek koşuda görmek istiyoruz
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]   # README: Python 3.11 veya üzeri

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        # Hedef dizinler ve gevşek ayarlar pyproject.toml [tool.mypy] içinde
        run: mypy

      - name: Test (pytest)
        run: pytest --junitxml=test-results.xml

      # Aşağıdaki iki adım `always()` taşıyor: asıl değerleri testler
      # KIRILDIĞINDA ortaya çıkıyor. `pytest` adımı kırmızıysa iş yine
      # başarısız sayılıyor — bunlar sonucu değiştirmiyor, görünür kılıyor.
      - name: Test özeti
        if: always()
        run: >
          python .github/scripts/test_summary.py
          test-results.xml
          "${{ matrix.os }} · Python ${{ matrix.python-version }}"
          >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      # Sayıların günlüğe inmeden görünmesi için. Depo günlüklerini API'den
      # indirmek yönetici yetkisi istiyor (403); artifact istemiyor.
      - name: Test raporunu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: warn
