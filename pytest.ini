[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers

# --strict-markers açık: tanımsız bir marker yazım hatası sayılır ve testi
# sessizce atlamak yerine hata verir.

# Per-test zaman aşımı (B-098, pytest-timeout — requirements-dev.txt).
#
# CI'ın iş-seviyesi `timeout-minutes: 30`u (ci.yml) asılan bir testi 30
# dakika boyunca İZSİZ tüketip "cancelled" ile bitiriyordu — hangi testin
# takıldığına dair günlükte hiçbir iz yok, `test-results.xml` bile hiç
# yazılmıyor (ölçüldü, 2026-08-30 Windows koşusu tam 30 dk sürüp öyle bitti).
# 120 sn, yerel en yavaş testin (18,76 sn, `--durations=25`) çok üzerinde
# bir pay bırakıyor. Windows'ta SIGALRM olmadığı için paket `thread`
# yöntemine düşüyor: testi zorla kesemez ama zaman aşımı anında TÜM
# thread'lerin yığın izini günlüğe yazdırıyor — asıl kazanç bu.
timeout = 120

markers =
    network: gerçek ağ erişimi gerektirir. Varsayılan olarak ATLANIR;
        çalıştırmak için HYCLEUS_TSA_NETWORK=1 (bkz. tests/test_timestamp.py).
        CI'da ağ dışa bağımlılığı testleri kırılgan yapardı — dış bir TSA'nın
        kesintisi HYCLEUS'un CI'ını kırmamalı.
