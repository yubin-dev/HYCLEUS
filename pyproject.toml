# HYCLEUS — lint / tip denetimi / statik güvenlik analizi yapılandırması
#
# Bu dosya paketleme için değil, yalnızca araç ayarları içindir.
# Runtime bağımlılıkları requirements.txt, CI bağımlılıkları requirements-dev.txt.
# pytest ayarları pytest.ini, semgrep kuralları .semgrep/ içindedir.

# ── ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
# Başlangıç seti = ruff'un varsayılanı: pycodestyle hataları + pyflakes.
# Amaç CI'ı yeşile almak, mevcut kodu yeniden yazmak değil.
# Sıkılaştırma ayrı bir iş — bkz. BACKLOG.md / B-002.
select = ["E4", "E7", "E9", "F"]

# Aşağıdakiler bugün mevcut kodda ihlal ediliyor; her biri ayrı ayrı
# temizlenene kadar susturuldu (sayılar 2026-08-13 taramasından).
ignore = [
    "E402",  # 33× modül-seviyesi import en üstte değil — sys.path bootstrap'ı
             #     bilinçli olarak importlardan önce çalışıyor (setup_usb.py,
             #     usb_manager.py, vault_manager.py). Kalıcı istisna olabilir.
    "F401",  #  8× kullanılmayan import (çoğu UI/ altında)
    "F541",  #  3× yer tutucusuz f-string
    "F841",  #  1× kullanılmayan yerel değişken
    "E741",  #  1× belirsiz değişken adı (l/I/O)
]

# ── mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
files = ["CORE", "DB"]

# HYCLEUS bir Windows uygulamasidir; tip denetimi her zaman Windows varsayimiyla
# yapilir. Bu satir olmadan mypy calistigi platformu varsayar ve CI'in Ubuntu
# ayagi ctypes.GetLastError, ctypes.windll, subprocess.CREATE_NO_WINDOW gibi
# typeshed'in `sys.platform == "win32"` arkasina aldigi attribute'lari
# "yok" sayarak kirilir — halbuki bu kod yalnizca Windows'ta calisir.
#
# Linux ayaginin isi Windows API cagrilarini dogrulamak degil; platformdan
# bagimsiz kripto katmanini pytest ile calistirmak.
platform = "win32"

# CORE/ ve DB/ altında __init__.py yok (PEP 420 namespace paketleri).
# Bunlar olmadan mypy CORE/x.py'yi hem "x" hem "CORE.x" olarak görüp hata verir.
mypy_path = "."
namespace_packages = true
explicit_package_bases = true

# Gevşek başlangıç: tip belirtilmemiş eski kod CI'ı kırmasın.
# wmi, PySide6, argon2, qrcode gibi stub'ı olmayan paketler için de gerekli.
# Sıkılaştırma (disallow_untyped_defs, strict) ayrı bir iş — BACKLOG.md / B-002.
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false

# UI/ hariç: PySide6 ağırlıklı, resmi stub'ı yok — ayrı bir işte ele alınacak.
exclude = ["^UI/"]

# ── bandit ────────────────────────────────────────────────────────────────────
# Çalıştırma:  bandit -c pyproject.toml -r CORE DB UI main.py
# `-c pyproject.toml` ZORUNLU — bandit bu dosyayı kendiliğinden bulmaz.
# TOML okuyabilmesi için `bandit[toml]` kurulu olmalı (requirements-dev.txt).
#
# Gevşek başlangıç, ruff'takiyle aynı gerekçe: amaç CI'ı yeşile almak, mevcut
# kodu yeniden yazmak değil. Sıkılaştırma ayrı bir iş — bkz. BACKLOG.md / B-018.
[tool.bandit]
# tests/ hariç: fuzz harness'ları ve kripto testleri bilerek bozuk girdi üretir;
# bandit orada anlamlı bir şey söylemiyor.
exclude_dirs = ["tests", "build", "dist", ".venv", "__pycache__"]

# Aşağıdaki denetimler 2026-08-16 taramasında toplu olarak tetiklendi ve tek
# tek incelendi. Her biri için gerekçe yazılı; ADET bilgisi bilerek burada:
# sayı değişirse yeni bir şey girmiş demektir.
#
#   B110 · 15× · try/except/pass — hepsi "en iyi çaba" yolları (konsol
#          yeniden yapılandırma, WMI sondası, keyring erişimi). Bilinçli
#          desen ama gerçekten geniş; teker teker daraltılmalı → B-018.
#   B608 · 13× · f-string ile SQL — ON ÜÇÜ DE incelendi, hiçbirinde
#          kullanıcı girdisi enterpolasyona girmiyor: sabit sütun listeleri
#          (_FILE_COLUMNS, _ORDER, _EXCLUDE_PRIVATE), sabit tablo demeti
#          (backup.RESTORABLE_TABLES) ve allowlist'ten geçmiş sütun adları
#          (retention.update_profile). Değerler her yerde `?` ile bağlı.
#   B603 ·  5× · subprocess, shell=False — hepsi liste biçimi çağrı.
#   B404 ·  4× · "subprocess import ettin" — bilgi amaçlı, bulgu değil.
#
# B607 (kısmi çalıştırılabilir yolu) 2026-08-17'de bu listeden ÇIKARILDI ve
# depo genelinde açıldı — B-018'in tek gerçek bulgusuydu, üç çağrısı vardı:
#   · `wmic` TAM YOLA çevrildi: %SystemRoot%\System32\wbem\wmic.exe
#     (CORE/usb_manager.py::_wmic_yolu).
#   · `open` / `xdg-open` satırda `# nosec B607` ile gerekçeli susturuldu.
#     İkisi de Windows dışı ve konumları dağıtıma göre değişiyor
#     (/usr/bin, /usr/local/bin); tam yol yazmak çalışan bir çağrıyı
#     VARSAYIMA dayanarak kırardı.
# Kazanç: YENİ bir kısmi yol çağrısı artık CI'da yakalanıyor.
#
# Tek tek görülenler burada DEĞİL, kaynak satırında `# nosec <ID>` ile
# gerekçeli olarak susturuldu (B101, B105, B311, B606, B607) — böylece o
# denetimler depo genelinde AÇIK kalıyor.
skips = ["B110", "B404", "B603", "B608"]
